[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu_roofline"
version = "0.1.0"
description = "A measurement-first curriculum in GPU programming, shipped as PRs"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
